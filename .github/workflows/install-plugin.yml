name: Install Dynamic Color Plugin

on:
  push:
    branches:
      - main 

jobs:
  install-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # 🚀 ফিক্সড: Capacitor এর লেটেস্ট ভার্সনের জন্য Node 22 দেওয়া হলো

      - name: Install dependencies and Plugin
        run: |
          npm install
          npm install github:ollm/cordova-plugin-dynamic-color
          npx cap sync

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git add android/ ios/ || true 
          git commit -m "feat: install dynamic color plugin" || echo "No changes to commit"
          git push
