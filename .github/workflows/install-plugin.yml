name: Install Dynamic Color Plugin

on:
  push:
    branches:
      - main 

# 🚀 ফিক্সড: বটকে কোড পুশ করার পারমিশন দেওয়া হলো
permissions:
  contents: write

jobs:
  install-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and Plugin
        run: |
          npm install
          npm install github:ollm/cordova-plugin-dynamic-color
          npx cap sync

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          
          # 🚀 ফিক্সড: ফোল্ডার থাকলে তবেই অ্যাড করবে, না থাকলে এরর দেবে না
          if [ -d "android" ]; then git add android/; fi
          if [ -d "ios" ]; then git add ios/; fi
          
          git commit -m "feat: install dynamic color plugin" || echo "No changes to commit"
          git push
