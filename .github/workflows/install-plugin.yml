name: Install Dynamic Color Plugin

on:
  push:
    branches:
      - main # আপনার ব্রাঞ্চের নাম (যদি master হয়, তবে master লিখবেন)

jobs:
  install-plugin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and Plugin
        run: |
          npm install
          # 🚀 সরাসরি গিটহাব থেকে ১০০% ওয়ার্কিং প্লাগইনটি ইন্সটল করা হচ্ছে
          npm install github:ollm/cordova-plugin-dynamic-color
          npx cap sync

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git add android/ ios/ || true 
          git commit -m "feat: install dynamic color plugin" || echo "No changes to commit"
          git push
