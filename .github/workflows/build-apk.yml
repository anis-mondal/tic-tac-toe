name: Build Offline Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --include=optional

      - name: Install Capacitor Packages
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/haptics

      - name: Build Web Application
        run: npm run build

      - name: Initialize Capacitor Config
        run: |
          echo '{"appId": "com.tictactoe.game", "appName": "Tic Tac Toe", "webDir": "dist", "backgroundColor": "#00000000", "plugins": {"SplashScreen": {"launchShowDuration": 0, "launchFadeOutDuration": 0, "launchAutoHide": true}}}' > capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Capacitor Sync
        run: npx cap sync

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --include=optional

      - name: Install Capacitor Packages
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/haptics

      - name: Build Web Application
        run: npm run build

      - name: Initialize Capacitor Config
        run: |
          echo '{"appId": "com.tictactoe.game", "appName": "Tic Tac Toe", "webDir": "dist", "backgroundColor": "#00000000", "plugins": {"SplashScreen": {"launchShowDuration": 0, "launchFadeOutDuration": 0, "launchAutoHide": true}}}' > capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Capacitor Sync
        run: npx cap sync

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configure APK Splits and Build
        run: |
          # ক্যাপাসিটর অটোমেটিকভাবে নামের মাঝে স্পেস দিয়ে দেয়, সেটি মুছে স্পেস-মুক্ত করা হচ্ছে (যাতে ক্র্যাশ না করে)
          sed -i 's/Tic Tac Toe/TicTacToe/g' android/app/build.gradle
          
          # গ্র্যাডল ফাইলে ৪টি আলাদা এপিকে তৈরির নির্দেশ যুক্ত করা হচ্ছে
          cat <<EOF >> android/app/build.gradle
          
          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                      universalApk true
                  }
              }
          }
          EOF
          
          # এবার বিল্ড করা হচ্ছে
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign and Rename Multiple Release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd android
          
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > release.keystore
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          
          find app/build/outputs/apk/release -name "*.apk" | while read -r APK_FILE; do
            BASENAME=$(basename "$APK_FILE" .apk)
            
            # আর্কিটেকচারের নাম (যেমন: arm64-v8a) বের করে আনা হচ্ছে
            CLEAN_ABI=$(echo "$BASENAME" | sed -E 's/TicTacToe-//g; s/-release.*//g; s/-unsigned.*//g')
            
            if [ -z "$CLEAN_ABI" ]; then
              CLEAN_ABI="universal"
            fi
            
            # নতুন সুন্দর নাম: TicTacToe-Release-arm64-v8a.apk
            FINAL_APK_NAME="TicTacToe-Release-${CLEAN_ABI}.apk"
            
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:game1234 --key-pass pass:game1234 --out "app/build/outputs/apk/release/$FINAL_APK_NAME" "$APK_FILE"
            
            rm "$APK_FILE"
          done

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Release-APKs
          path: android/app/build/outputs/apk/release/TicTacToe-Release-*.apk
