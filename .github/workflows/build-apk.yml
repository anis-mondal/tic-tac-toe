name: Build Offline Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --include=optional

      - name: Install Capacitor Packages
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/haptics

      - name: Build Web Application
        run: npm run build

      - name: Initialize Capacitor Config
        run: |
          echo '{"appId": "com.tictactoe.game", "appName": "Tic Tac Toe", "webDir": "dist", "backgroundColor": "#00000000", "plugins": {"SplashScreen": {"launchShowDuration": 0, "launchFadeOutDuration": 0, "launchAutoHide": true}}}' > capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Capacitor Sync
        run: npx cap sync

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Debug & Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Sign Release APK
        run: |
          cd android
          keytool -genkey -v -keystore release.keystore -alias tictactoe -keyalg RSA -keysize 2048 -validity 10000 -storepass "game1234" -keypass "game1234" -dname "CN=TicTacToe, O=Game"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:game1234 --key-pass pass:game1234 --out app/build/outputs/apk/release/app-release-signed.apk "$APK_FILE"

      - name: Organize and Rename APKs
        run: |
          mkdir -p final-apks
          
          # স্বয়ংক্রিয়ভাবে ডিবাগ এপিকে খুঁজে বের করে রিনেম করা
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$DEBUG_APK" final-apks/TicTacToe-Debug.apk
          
          # রিলিজ এপিকে ফাইল রিনেম করা
          cp android/app/build/outputs/apk/release/app-release-signed.apk final-apks/TicTacToe-Release.apk

      - name: Upload Finished APKs
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Final-APKs
          path: final-apks/
