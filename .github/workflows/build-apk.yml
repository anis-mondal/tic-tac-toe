name: Build Offline Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --include=optional

      - name: Install Capacitor Packages
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/haptics

      - name: Build Web Application
        run: npm run build

      - name: Initialize Capacitor Config
        run: |
          echo '{"appId": "com.tictactoe.game", "appName": "Tic Tac Toe", "webDir": "dist", "backgroundColor": "#00000000", "plugins": {"SplashScreen": {"launchShowDuration": 0, "launchFadeOutDuration": 0, "launchAutoHide": true}}}' > capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Capacitor Sync
        run: npx cap sync

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --include=optional

      - name: Install Capacitor Packages
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/haptics

      - name: Build Web Application
        run: npm run build

      - name: Initialize Capacitor Config
        run: |
          echo '{"appId": "com.tictactoe.game", "appName": "Tic Tac Toe", "webDir": "dist", "backgroundColor": "#00000000", "plugins": {"SplashScreen": {"launchShowDuration": 0, "launchFadeOutDuration": 0, "launchAutoHide": true}}}' > capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Capacitor Sync
        run: npx cap sync

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configure APK Splits and Build
        run: |
          # পারমানেন্ট সমাধান: Gradle-কে বলে দেওয়া হচ্ছে প্রতিটি APK-এর নাম যেন তার আর্কিটেকচার (ABI) অনুযায়ী একদম আলাদা হয়
          cat <<'EOF' >> android/app/build.gradle
          
          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                      universalApk true
                  }
              }
          }
          
          // ফাইল ক্র্যাশ এড়াতে প্রতিটি ফাইলের ইউনিক নাম তৈরি করা হচ্ছে
          android.applicationVariants.all { variant ->
              variant.outputs.all { output ->
                  def abi = output.getFilter(com.android.build.OutputFile.ABI)
                  if (abi == null) {
                      abi = "universal"
                  }
                  output.outputFileName = "TicTacToe-Release-" + abi + ".apk"
              }
          }
          EOF
          
          # পূর্বের ভুল ফাইল থাকলে তা ক্লিন করে বিল্ড করা হচ্ছে
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: Sign Release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd android
          
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > release.keystore
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          
          # নতুন ইউনিক নামের ফাইলগুলোকে খুঁজে বের করে সাইন করা
          find app/build/outputs/apk/release -name "*.apk" | while read -r APK_FILE; do
            BASENAME=$(basename "$APK_FILE" .apk)
            
            # যদি নামের শেষে "-unsigned" থাকে, তবে সেটি মুছে দেওয়া
            CLEAN_NAME=$(echo "$BASENAME" | sed 's/-unsigned//g')
            
            FINAL_APK_NAME="${CLEAN_NAME}-signed.apk"
            
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:game1234 --key-pass pass:game1234 --out "app/build/outputs/apk/release/$FINAL_APK_NAME" "$APK_FILE"
            
            rm "$APK_FILE"
          done

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Release-APKs
          path: android/app/build/outputs/apk/release/*-signed.apk
