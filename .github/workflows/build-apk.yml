name: Build Offline Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==========================================
  # জব ১: ডিবাগ এপিকে তৈরি (প্যারালাল চলবে)
  # ==========================================
  build_debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --include=optional

      - name: Install Capacitor Packages
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/haptics

      - name: Build Web Application
        run: npm run build

      - name: Initialize Capacitor Config
        run: |
          echo '{"appId": "com.tictactoe.game", "appName": "Tic Tac Toe", "webDir": "dist", "backgroundColor": "#00000000", "plugins": {"SplashScreen": {"launchShowDuration": 0, "launchFadeOutDuration": 0, "launchAutoHide": true}}}' > capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Capacitor Sync
        run: npx cap sync

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

  # ==========================================
  # জব ২: রিলিজ এপিকে তৈরি (একই সাথে চলবে)
  # ==========================================
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Project Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --include=optional

      - name: Install Capacitor Packages
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/haptics

      - name: Build Web Application
        run: npm run build

      - name: Initialize Capacitor Config
        run: |
          echo '{"appId": "com.tictactoe.game", "appName": "Tic Tac Toe", "webDir": "dist", "backgroundColor": "#00000000", "plugins": {"SplashScreen": {"launchShowDuration": 0, "launchFadeOutDuration": 0, "launchAutoHide": true}}}' > capacitor.config.json

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Capacitor Sync
        run: npx cap sync

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Unsigned Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign Release APK with Persistent Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd android
          
          # গিটহাব সিক্রেট থেকে কিস্টোর রিকভার করা হচ্ছে
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          # একই চাবি দিয়ে এপিকে সাইন করা হচ্ছে
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:game1234 --key-pass pass:game1234 --out app/build/outputs/apk/release/TicTacToe-Release.apk "$APK_FILE"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Release-APK
          path: android/app/build/outputs/apk/release/TicTacToe-Release.apk
