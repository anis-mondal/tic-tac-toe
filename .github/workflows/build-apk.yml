name: Build Offline Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==============================
  # ১. ডিবাগ বিল্ড
  # ==============================
  build_debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install All Dependencies
        run: npm ci 

      - name: Build Web Application
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache --parallel

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk

  # ==============================
  # ২. রিলিজ বিল্ড (শুধু তৈরি করবে)
  # ==============================
  build_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install All Dependencies
        run: npm ci 

      - name: Build Web Application
        run: npm run build

      - name: Capacitor Sync
        run: npx cap sync

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Configure APK Splits and Build
        run: |
          cat <<'EOF' >> android/app/build.gradle
          
          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                      universalApk true
                  }
              }
          }
          
          android.applicationVariants.all { variant ->
              variant.outputs.all { output ->
                  def abi = output.getFilter(com.android.build.OutputFile.ABI)
                  if (abi == null) {
                      abi = "universal"
                  }
                  output.outputFileName = "TicTacToe-Release-" + abi + ".apk"
              }
          }
          EOF
          
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel

      - name: Sign Release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd android
          
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > release.keystore
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          
          find app/build/outputs/apk/release -name "*.apk" | while read -r APK_FILE; do
            BASENAME=$(basename "$APK_FILE" .apk)
            CLEAN_NAME=$(echo "$BASENAME" | sed 's/-unsigned//g')
            FINAL_APK_NAME="${CLEAN_NAME}-signed.apk"
            
            $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:game1234 --key-pass pass:game1234 --out "app/build/outputs/apk/release/$FINAL_APK_NAME" "$APK_FILE"
            
            rm "$APK_FILE"
          done

      # অন্য Job-গুলোকে দেওয়ার জন্য টেম্পোরারি সেভ করা হলো
      - name: Save APKs temporarily for upload jobs
        uses: actions/upload-artifact@v4
        with:
          name: temp-signed-apks
          path: android/app/build/outputs/apk/release/*-signed.apk
          retention-days: 1

  # ==============================
  # ৩. আপলোড টাস্ক (গ্রাফে শাখা তৈরি করবে)
  # ==============================
  upload_bundle:
    needs: build_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: temp-signed-apks
          path: release-apks
      - name: Upload All Release APKs (Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Release-All-APKs
          path: release-apks/*-signed.apk

  upload_universal:
    needs: build_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: temp-signed-apks
          path: release-apks
      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Release-Universal
          path: release-apks/TicTacToe-Release-universal-signed.apk
          if-no-files-found: ignore

  upload_arm64_v8a:
    needs: build_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: temp-signed-apks
          path: release-apks
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Release-arm64-v8a
          path: release-apks/TicTacToe-Release-arm64-v8a-signed.apk
          if-no-files-found: ignore

  upload_armeabi_v7a:
    needs: build_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: temp-signed-apks
          path: release-apks
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Release-armeabi-v7a
          path: release-apks/TicTacToe-Release-armeabi-v7a-signed.apk
          if-no-files-found: ignore

  upload_x86:
    needs: build_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: temp-signed-apks
          path: release-apks
      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Release-x86
          path: release-apks/TicTacToe-Release-x86-signed.apk
          if-no-files-found: ignore

  upload_x86_64:
    needs: build_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: temp-signed-apks
          path: release-apks
      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: TicTacToe-Release-x86_64
          path: release-apks/TicTacToe-Release-x86_64-signed.apk
          if-no-files-found: ignore
