<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    
    <!-- App Title and Description -->
    <title>Tic Tac Toe - Premium</title>
    <meta name="description" content="Play this premium Material You Tic Tac Toe game with a friend or against AI!" />

    <!-- Browser Favicon and Apple Touch Icons (For Bookmarks and Add to Home Screen) -->
    <link rel="icon" type="image/png" href="https://anis-mondal.github.io/tic-tac-toe/preview.png" />
    <link rel="apple-touch-icon" href="https://anis-mondal.github.io/tic-tac-toe/preview.png" />
    
    <!-- PWA and Theme Colors -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />

    <!-- Open Graph (For Facebook, WhatsApp, LinkedIn, Discord, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anis-mondal.github.io/tic-tac-toe/" />
    <meta property="og:title" content="Tic Tac Toe - Premium" />
    <meta property="og:description" content="Play this premium Material You Tic Tac Toe game with a friend or against AI!" />
    <meta property="og:image" content="https://anis-mondal.github.io/tic-tac-toe/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X Cards (For Twitter sharing) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://anis-mondal.github.io/tic-tac-toe/" />
    <meta name="twitter:title" content="Tic Tac Toe - Premium" />
    <meta name="twitter:description" content="Play this premium Material You Tic Tac Toe game with a friend or against AI!" />
    <meta name="twitter:image" content="https://anis-mondal.github.io/tic-tac-toe/preview.png" />

    <style>html, body { background-color: #ffffff; } @media (prefers-color-scheme: dark) { html, body { background-color: #000000; } }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
